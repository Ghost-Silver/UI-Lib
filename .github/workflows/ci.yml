name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build · typecheck · test · size · lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match `packageManager` in the root package.json.
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Packages resolve each other through `dist/`, so nothing that touches a
      # cross-package import can run before the build.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Size budget
        run: pnpm size

      - name: Lint
        run: pnpm lint

  browser:
    name: browser acceptance (chromium)
    runs-on: ubuntu-latest
    # The suite has its own 8-minute global ceiling; this is the backstop for
    # a wedged browser that refuses to shut down.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The docs playground aliases every `@ui-lib/*` import to workspace
      # source, but the build still runs first so the job does not depend on
      # that aliasing staying complete.
      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The acceptance suite serves the built playground, so it has to exist
      # first. CI runs the server here rather than letting Playwright spawn it:
      # see the webServer comment in playwright.config.ts for why.
      - name: Build docs playground
        run: pnpm --filter @ui-lib/docs build

      - name: Serve the playground
        run: |
          nohup pnpm --filter @ui-lib/docs preview --host 127.0.0.1 --port 5173 --strictPort \
            > "$RUNNER_TEMP/playground.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5173/; then
              echo "playground is up"
              exit 0
            fi
            sleep 1
          done
          echo "playground never came up:"
          cat "$RUNNER_TEMP/playground.log"
          exit 1

      - name: Acceptance suite
        run: pnpm test:e2e

      # `check:shaders` is deliberately absent from this job, but its sibling
      # is not. The two structural questions this asks — did anything reach the
      # canvas, and did the glass land on its element — are not adapter
      # specific, so SwiftShader answers them honestly. What still needs a real
      # GPU is how it looks, and that stays out.
      - name: Pixel gate — prove the probe can fail
        run: pnpm check:pixels:self-test

      - name: Pixel gate — canvas is drawing, glass is on its element
        run: pnpm check:pixels

      # A browser that wedges leaves no console output. The HTML report and
      # any retained traces are the only evidence, so always collect them.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

# What this workflow deliberately does NOT gate on:
#
#   * How any of it looks. `pnpm check:pixels` runs here and does look at the
#     canvas, but only for two structural facts: that the frame is not flat,
#     and that hiding a glass element changes the pixels inside that element's
#     rectangle. It is not an aesthetic baseline and cannot tell whether the
#     glass is beautiful. Stored screenshot references would be device-specific
#     and would rot on every driver update, so there is no `toHaveScreenshot`
#     anywhere in the repo; a GPU-bucketed matrix is still tracked in
#     docs/ROADMAP.md under P0.
#   * FPS, dropped frames and VRAM. Those need real devices.
#
#   * Shader and render-pipeline compilation. `pnpm check:shaders` covers that,
#     and it is not wired in here on purpose: a Tint lowering failure can be
#     adapter-specific (the `swizzle view instruction still has usages` bug
#     reproduced on Metal and passed on SwiftShader with byte-identical WGSL),
#     and a headless runner has no GPU. It stays green for months on end while
#     the WebGPU post chain never runs. Run it on a machine with a real GPU
#     before pushing anything that touches a node graph: `pnpm verify:device`.
