<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>UI-Lib · Liquid Glass</title>
		<meta
			name="description"
			content="GPU-first visual effects for the web. Real refraction, dispersion and frosted glass — WebGPU with automatic WebGL 2 fallback."
		/>
	</head>
	<body>
		<!-- Real-device telemetry: capture fatal errors *before* the module graph
		     mounts and POST them back to the dev server so the failure that only
		     shows up on physical WebGPU devices can be read by the developer. -->
		<script>
			(() => {
				const url = "/__ui-lib-diag";
				const queue = [];
				let boot = null;
				const post = () => {
					if (queue.length === 0 && boot === null) return;
					const body = JSON.stringify({ t: Date.now(), boot, events: queue.splice(0) });
					boot = null;
					try {
						fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body });
					} catch {}
				};
				const push = (ev) => {
					queue.push(ev);
					clearTimeout(window.__dgt);
					window.__dgt = setTimeout(post, 400);
				};
				const fmt = (v) => {
					try {
						if (v instanceof Error) return `${v.name}: ${v.message}` + (v.stack ? `\n${v.stack}` : "");
						if (typeof v === "object") return JSON.stringify(v);
						return String(v);
					} catch {
						return String(v);
					}
				};
				window.addEventListener("error", (e) => push({ type: "error", msg: fmt(e.error || e.message) }));
				window.addEventListener("unhandledrejection", (e) => push({ type: "unhandledrejection", msg: fmt(e.reason) }));
				window.addEventListener("webglcontextlost", (e) => push({ type: "webglcontextlost", msg: String(e.statusMessage || e) }));
				document.addEventListener("webglcontextlost", (e) => push({ type: "webglcontextlost_doc", msg: String(e.statusMessage || e) }), true);
				const origErr = console.error.bind(console);
				console.error = (...a) => { push({ type: "console.error", msg: a.map(fmt).join(" ") }); origErr(...a); };
				const origWarn = console.warn.bind(console);
				console.warn = (...a) => { push({ type: "console.warn", msg: a.map(fmt).join(" ") }); origWarn(...a); };
				// WebGPU surfaces validation failures asynchronously on the device's
				// `uncapturederror` event — the single most direct error source.
				try {
					const nav = navigator.gpu;
					if (nav && nav.requestAdapter) {
						const oa = nav.requestAdapter.bind(nav);
						nav.requestAdapter = async (...a) => {
							const adapter = await oa(...a);
							try {
								if (adapter && adapter.requestDevice) {
									const od = adapter.requestDevice.bind(adapter);
									adapter.requestDevice = async (...b) => {
										const device = await od(...b);
										try {
											device.addEventListener("uncapturederror", (e) =>
												push({ type: "uncapturederror", msg: String(e.error?.message || e) }),
											);
										} catch {}
										return device;
									};
								}
							} catch {}
							return adapter;
						};
					}
				} catch (e) {}
				window.addEventListener("load", () => {
					let wg2 = false, wgpu = false, gpuName = "";
					try {
						const c = document.createElement("canvas");
						wg2 = !!c.getContext("webgl2");
						const g = c.getContext("webgpu");
						if (g) wgpu = true;
					} catch (err) { wg2 = false; }
					try { gpuName = navigator.gpu ? "navigator.gpu" : ""; } catch {}
					boot = { ua: navigator.userAgent.slice(0, 220), webgl2: wg2, wgpu, gpu: gpuName, vp: `${innerWidth}x${innerHeight}` };
					push({ type: "boot" });
				});
				window.__uiLibFlush = post;
			})();
		</script>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
